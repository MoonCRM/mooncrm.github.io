function treatmentEditor(p, t, opts) {
  opts = opts || {};
  const d = S.data, schedule = !!opts.schedule || (t && t.status === 'נקבע');
  const neededList = (IDX.tByP[p.id] || []).filter(x => x.status === 'נדרש');
  let base = t || opts.prefill || null;
  // "Schedule" from the card with open needs: let her pick which need this appointment covers.
  const pick = !t && schedule && neededList.length ? h('select', { class: 'i', onchange: e => { base = IDX.t[e.target.value] || null; fill(); } },
    opt('', '— טיפול חדש —'), neededList.map(x => opt(x.id, `${x.type}${x.tooth ? ' · ' + x.tooth : ''}${x.course ? ' · ' + x.course : ''}`))) : null;

  const typeIn = h('input', { class: 'i', list: 'typeNames', placeholder: 'סוג טיפול' });
  const courseIn = h('select', { class: 'i' });
  const tooth = h('input', { class: 'i', placeholder: 'למשל 36 או רביע 2' });
  const code = h('input', { class: 'i', placeholder: 'למשל ח6' });
  const date = h('input', { class: 'i', type: 'date' });
  const time = h('input', { class: 'i', type: 'time', step: 300 });
  const dur = h('input', { class: 'i', type: 'number', min: 10, step: 5 });
  const status = h('select', { class: 'i' }, Object.values(d.meta.tStatus).map(s => opt(s)));
  const counts = h('input', { type: 'checkbox' });
  const writers = (d.sources || []).filter(x => x.write && x.active);
  const writeChk = h('input', { type: 'checkbox', checked: !opts.fromTable });
  const notes = h('input', { class: 'i' });
  const myCourses = String(p.courses || '').split(/,\s*/).filter(Boolean);
  const courseOpts = Array.from(new Set(myCourses.concat(d.courses)));

  function fill() {
    const b = base || {};
    typeIn.value = b.type || '';
    courseIn.replaceChildren(opt('', '—'), ...courseOpts.map(c => opt(c, c, (b.course || myCourses[0]) === c)));
    tooth.value = b.tooth || '';
    code.value = b.code || '';
    const s = D(b.start);
    date.value = s ? dKey(s) : '';
    time.value = s ? fTime(s) : '';
    dur.value = b.duration || ((d.types.find(x => x.name === b.type) || {}).duration || '');
    status.value = b.status && !(schedule && b.status === 'נדרש') ? b.status : (schedule ? 'נקבע' : 'נדרש');
    counts.checked = b.counts === undefined || b.counts === '' || b.counts === 'כן' || b.counts === true;
    notes.value = b.notes || '';
  }
  fill();
  typeIn.addEventListener('change', () => {
    const tt = d.types.find(x => x.name === typeIn.value);
    if (tt && !dur.value) dur.value = tt.duration;
  });

  sheet(close => [
    h('h3', null, t ? 'עריכת טיפול' : schedule ? `קביעת תור – ${p.name}` : `טיפול נדרש – ${p.name}`),
    pick ? [h('label', { class: 'f' }, 'איזה טיפול נדרש קובעים?'), pick] : null,
    h('label', { class: 'f' }, 'סוג טיפול'), typeIn, h('datalist', { id: 'typeNames' }, (d.treatmentNames || d.types.map(x => x.name)).map(n => opt(n))),
    h('div', { class: 'two' },
      h('div', null, h('label', { class: 'f' }, 'קורס'), courseIn),
      h('div', null, h('label', { class: 'f' }, 'שן / אזור'), tooth)),
    h('label', { class: 'f' }, 'קוד (אופציונלי)'), code,
    h('div', { class: 'two' },
      h('div', null, h('label', { class: 'f' }, 'תאריך'), date),
      h('div', null, h('label', { class: 'f' }, 'שעה'), time)),
    h('div', { class: 'two' },
      h('div', null, h('label', { class: 'f' }, 'משך (דקות)'), dur),
      h('div', null, h('label', { class: 'f' }, 'סטטוס'), status)),
    h('label', { class: 'row small', style: 'margin-top:10px' }, counts, 'נספר לדרישות הקורס'),
    writers.length ? h('label', { class: 'row small', style: 'margin-top:6px' }, writeChk, 'לרשום גם ב: ' + writers.map(w => w.name).join(', ')) : null,
    h('label', { class: 'f' }, 'הערות'), notes,
    schedule ? h('div', { class: 'muted small', style: 'margin-top:8px' }, '📅 התור ייכנס ליומן "MoonCRM – מטופלים" עם התראות שבועיים, שבוע ויום לפני, וקישורי וואטסאפ מוכנים.') : null,
    h('div', { class: 'actions' },
      h('button', { class: 'btn primary', onclick: async () => {
        if ((date.value && !time.value) || (!date.value && time.value)) return toast('צריך גם תאריך וגם שעה', true);
        const payload = {
          id: base && base.id, patientId: p.id, type: typeIn.value.trim(), course: courseIn.value, tooth: tooth.value, code: code.value.trim(),
          start: date.value ? `${date.value}T${time.value}` : '', duration: Number(dur.value) || '',
          status: status.value, counts: counts.checked ? 'כן' : 'לא', notes: notes.value, writeBack: writeChk.checked
        };
        if (payload.status === 'נקבע' && !payload.start) return toast('כדי לקבוע תור צריך תאריך ושעה', true);
        const r = await mutate('saveTreatment', payload);
        close();
        r.server.then(sr => (sr && sr.writeBack || []).forEach(w => toast(w.ok ? `✍️ נרשם ב"${w.source}" (${w.cell})` : `⚠️ "${w.source}": ${w.message}`, !w.ok)));
        if (payload.status === 'נקבע' && (!base || !base.id || base.status !== 'נקבע')) {
          const tpl = tplByTrigger('קביעת תור');
          if (tpl && await ask('התור נקבע ונוסף ליומן ✓ לשלוח ' + ({ 'זכר': 'למטופל', 'נקבה': 'למטופלת' }[p.gender] || 'למטופל/ת') + ' הודעת אישור?', '💬 כן, לניסוח', 'לא עכשיו')) composer(p.id, { templateKey: tpl.key, treatmentId: r.id });
        } else {
          toast('נשמר');
          r.server.then(sr => sr && sr.recallSet && toast(`ביקורת ב-${fDateY(D(sr.recallSet))}`));
        }
      } }, schedule ? 'קביעה' : 'שמירה'),
      base && base.id ? h('button', { class: 'btn danger', onclick: async () => {
        if (!await ask('למחוק את הטיפול לגמרי? (אם רק התבטל – עדיף לסמן "בוטל")', 'מחיקה')) return;
        await mutate('deleteTreatment', base.id); close();
      } }, 'מחיקה') : null,
      h('button', { class: 'btn ghost', onclick: close }, 'ביטול'))
  ]);
}

/** Message composer: pick template (+ appointment) → rendered text → WhatsApp / copy → mark sent. */
const CONFIRM = { YES: 'אישר/ה', LATER: 'ביקש/ה לדחות' };
const confirmBadge = t => t.confirm === CONFIRM.YES ? h('span', { class: 'badge ok' }, '✓ אישר/ה הגעה')
  : t.confirm === CONFIRM.LATER ? h('span', { class: 'badge warn' }, '🔄 ביקש/ה לדחות') : null;

/** One tap to record what the patient answered (in WhatsApp) to a reminder. */
function confirmRow(p, t) {
  const g = p.gender, said = { 'זכר': ['אישר', 'ביקש לדחות', 'ביטל'], 'נקבה': ['אישרה', 'ביקשה לדחות', 'ביטלה'] }[g] || ['אישר/ה', 'ביקש/ה לדחות', 'ביטל/ה'];
  return h('div', { class: 'row wrap small', style: 'margin-top:6px;gap:6px' },
    h('span', { class: 'muted' }, 'תגובה:'),
    t.confirm !== CONFIRM.YES ? h('button', { class: 'chip', onclick: () => mutate('confirmTreatment', t.id, CONFIRM.YES).then(() => toast('✓ סומן – מופיע גם ביומן')) }, '✓ ' + said[0]) : null,
    t.confirm !== CONFIRM.LATER ? h('button', { class: 'chip', onclick: async () => {
      await mutate('confirmTreatment', t.id, CONFIRM.LATER);
      treatmentEditor(IDX.p[p.id], IDX.t[t.id] || t);
    } }, '🔄 ' + said[1]) : null,
    h('button', { class: 'chip', onclick: async () => {
      if (await ask('לבטל את התור? האירוע יימחק מהיומן' + ((S.data.sources || []).some(x => x.write) ? ' ומהטבלה המשותפת (אם נרשם בה).' : '.'), 'כן, לבטל את התור', 'לא, להשאיר'))
        mutate('saveTreatment', { id: t.id, status: 'בוטל' });
    } }, '✗ ' + said[2]),
    t.confirm ? h('button', { class: 'chip', onclick: () => mutate('confirmTreatment', t.id, '') }, 'ניקוי') : null);
}

/** Today's messages one after another: open WhatsApp ready to send → back → "sent, next". */
function sendQueue() {
  const todo = S.data.todo;
  const items = todo.reminders.map(r => ({ pid: r.patientId, tid: r.treatmentId, key: r.key,
    tpl: (tplByTrigger(OFFSET_TRIGGER[r.offset]) || {}).key, label: OFFSET_LABEL[r.offset] || `תזכורת ${r.offset} ימים` }))
    .concat(todo.recalls.map(r => ({ pid: r.patientId, tid: '', key: r.key, tpl: (tplByTrigger('ביקורת') || {}).key, label: 'זימון לביקורת' })))
    .filter(x => IDX.p[x.pid] && x.tpl);
  let i = 0, opened = false, done = 0, cur = null;
  const box = h('div');
  const ta = h('textarea', { class: 'i', style: 'min-height:120px' });
  const next = () => { i++; opened = false; show(); };
  const sent = async () => {
    const it = items[i];
    mutate('markSent', it.key, it.pid, it.label, 'וואטסאפ', ta.value);
    done++;
    next();
  };
  const show = async () => {
    if (i >= items.length) {
      box.replaceChildren(h('div', { class: 'empty' }, done ? `🎉 נשלחו ${done} הודעות` : 'סיימת'));
      load('bootstrap');
      return;
    }
    const it = items[i], p = IDX.p[it.pid];
    box.replaceChildren(h('div', { class: 'muted small' }, `${i + 1} מתוך ${items.length}`), h('div', { class: 'empty' }, 'מכין…'));
    try { cur = await call('renderMessage', it.pid, it.tpl, it.tid); } catch (e) { cur = { text: '', phone: '' }; toast(e.message, true); }
    ta.value = cur.text;
    const wa = h('a', { class: 'btn wa', target: '_blank', onclick: () => { opened = true; setTimeout(paintAfter, 400); } }, '💬 פתיחה בוואטסאפ');
    const syncHref = () => { wa.href = `https:\/\/wa.me/${cur.phone || ''}?text=${encodeURIComponent(ta.value)}`; };
    ta.oninput = syncHref; syncHref();
    const after = h('div', { class: 'actions' });
    const paintAfter = () => after.replaceChildren(
      h('button', { class: 'btn primary', onclick: sent }, opened ? '✓ נשלח – הבא' : '✓ סימון כנשלח'),
      h('button', { class: 'btn ghost', onclick: next }, 'דילוג'));
    paintAfter();
    box.replaceChildren(...[
      h('div', { class: 'muted small' }, `${i + 1} מתוך ${items.length}`),
      h('div', { class: 'row', style: 'margin:4px 0' }, h('b', { class: 'grow' }, p.name), h('span', { class: 'badge' }, it.label)),
      !cur.phone ? h('div', { class: 'alert info small' }, 'אין טלפון בכרטיס – וואטסאפ ייפתח לבחירת איש קשר.') : null,
      ta, h('div', { class: 'actions' }, wa), after].filter(Boolean));
  };
  // Back from WhatsApp: make "sent, next" the obvious next tap.
  const onVis = () => { if (document.visibilityState === 'visible' && opened) box.querySelector('.btn.primary') && box.querySelector('.btn.primary').focus(); };
  document.addEventListener('visibilitychange', onVis);
  sheet(close => [h('h3', null, '▶ שליחה ברצף'), box,
    h('div', { class: 'actions' }, h('button', { class: 'btn ghost', onclick: () => { document.removeEventListener('visibilitychange', onVis); close(); load('bootstrap'); } }, 'סגירה'))]);
  show();
}

function composer(pid, o) {
  o = o || {};
  const p = IDX.p[pid], d = S.data;
  const tpls = d.templates;
  const tplSel = h('select', { class: 'i' }, tpls.map(t => opt(t.key, t.name, t.key === o.templateKey)));
  if (!o.templateKey && tpls[0]) tplSel.value = tpls[0].key;
  const appts = (IDX.tByP[pid] || []).filter(t => t.status === 'נקבע' || t.status === 'נדרש' || t.status === 'בוצע')
    .sort((a, b) => (D(b.start) || 0) - (D(a.start) || 0));
  const tSel = h('select', { class: 'i' }, opt('', 'אוטומטי (התור הבא)'),
    appts.map(t => opt(t.id, `${t.type}${D(t.start) ? ' · ' + fDate(D(t.start)) : ''} (${t.status})`, t.id === o.treatmentId)));
  const ta = h('textarea', { class: 'i', style: 'min-height:170px' });
  const phone = String(p.phone || '').replace(/\D/g, '').replace(/^0/, '972');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const waBtn = h('a', { class: 'btn wa', target: '_blank', rel: 'noopener' }, '💬 פתיחה בוואטסאפ');
  const smsBtn = h('a', { class: 'btn wa', target: '_blank', rel: 'noopener' }, '✉️ פתיחה בהודעות (SMS)');
  const syncLinks = () => {
    waBtn.href = `https:\/\/wa.me/${phone}?text=${encodeURIComponent(ta.value)}`;
    smsBtn.href = `sms:+${phone}${isIOS ? '&' : '?'}body=${encodeURIComponent(ta.value)}`;
  };
  ta.addEventListener('input', syncLinks);
  // Email channel: sent from the user's own Gmail through the server.
  const toIn = h('input', { class: 'i', type: 'email', value: p.email || '', placeholder: 'כתובת מייל' });
  const subjIn = h('input', { class: 'i', placeholder: 'נושא' });
  const pref = String(p.contactPref || '');
  let channel = /מייל|mail/i.test(pref) || (!p.phone && p.email) ? 'mail' : /SMS|סמס/i.test(pref) ? 'sms' : 'wa';
  const renderMsg = () => {
    ta.value = '…';
    call('renderMessage', pid, tplSel.value, tSel.value).then(r => { ta.value = r.text; subjIn.value = r.subject; syncLinks(); }).catch(e => toast(e.message, true));
  };
  tplSel.addEventListener('change', renderMsg);
  tSel.addEventListener('change', renderMsg);
  if (!p.gender) toast('ללשון הפנייה לא הוגדר מגדר – ההטיות יופיעו כ"אשר/אשרי"');
  const label = () => o.sentLabel || (tpls.find(t => t.key === tplSel.value) || {}).name || 'הודעה';

  sheet(close => {
    // WhatsApp/SMS leave the app, so the user confirms it was sent; that saves it to the history.
    const sentBtn = h('button', { class: 'btn' }, '✓ נשלח – שמירה בהיסטוריה');
    sentBtn.addEventListener('click', async () => {
      await mutate('markSent', o.sentKey || '', pid, label(), channel === 'sms' ? 'SMS' : 'וואטסאפ', ta.value);
      close(); toast('נשמר בהיסטוריה');
    });
    [waBtn, smsBtn].forEach(b => b.addEventListener('click', () => setTimeout(() => sentBtn.classList.add('primary'), 400)));
    const sendMail = async () => {
      const to = toIn.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) return toast('כתובת המייל לא תקינה', true);
      if (!await ask(`לשלוח את ההודעה במייל אל ${to}?\nהמייל יישלח מחשבון הג'ימייל שלך.`, '📧 שליחה')) return;
      await mutate('sendEmail', { patientId: pid, to, subject: subjIn.value, body: ta.value, sentKey: o.sentKey || '' });
      close(); toast('📧 המייל נשלח');
    };
    const copyBtn = h('button', { class: 'btn', onclick: () => navigator.clipboard.writeText(ta.value).then(() => toast('הועתק'), () => { ta.select(); document.execCommand('copy'); toast('הועתק'); }) }, '📋 העתקה');
    const phoneBox = h('div', { class: 'actions' }, waBtn, smsBtn, copyBtn, sentBtn, h('button', { class: 'btn ghost', onclick: close }, 'סגירה'));
    const mailBox = h('div', null,
      h('label', { class: 'f' }, 'אל'), toIn,
      h('label', { class: 'f' }, 'נושא'), subjIn,
      h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: sendMail }, '📧 שליחה במייל'),
        h('button', { class: 'btn ghost', onclick: close }, 'סגירה')));
    const seg = h('div', { class: 'seg', style: 'margin-bottom:6px' });
    const paint = () => {
      seg.replaceChildren(...[['wa', '💬 וואטסאפ'], ['sms', '✉️ SMS'], ['mail', '📧 מייל']].map(([k, l]) =>
        h('button', { class: channel === k ? 'on' : '', onclick: () => { channel = k; paint(); } }, l)));
      phoneBox.classList.toggle('hidden', channel === 'mail');
      waBtn.classList.toggle('hidden', channel !== 'wa');
      smsBtn.classList.toggle('hidden', channel !== 'sms');
      mailBox.classList.toggle('hidden', channel !== 'mail');
    };
    paint();
    return [
      h('h3', null, `הודעה ל${p.name}`),
      pref ? h('div', { class: 'muted small', style: 'margin:-4px 0 6px' }, 'דרך יצירת קשר מועדפת: ' + pref,
        /שיחה|טלפון/.test(pref) && p.phone ? h('a', { class: 'btn sm', style: 'margin-inline-start:8px', href: 'tel:' + p.phone }, '📞 התקשרות') : null) : null,
      seg,
      h('label', { class: 'f' }, 'תבנית'), tplSel,
      h('label', { class: 'f' }, 'עבור תור'), tSel,
      h('label', { class: 'f' }, 'ההודעה (אפשר לערוך לפני השליחה)'), ta,
      !p.phone ? h('div', { class: 'alert info small', style: 'margin-top:8px' }, 'אין מספר טלפון בכרטיס – וואטסאפ ייפתח לבחירת איש קשר. כדאי להוסיף טלפון בכרטיס המטופל.') : null,
      phoneBox, mailBox
    ];
  });
  renderMsg();
}

/** In-app confirm (native confirm/prompt can be blocked inside the Apps Script iframe). */
function ask(message, okLabel, cancelLabel) {
  return new Promise(resolve => {
    sheet(close => [
      h('p', { style: 'white-space:pre-line;font-size:17px;margin:4px 0 12px' }, message),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', onclick: () => { close(); resolve(true); } }, okLabel || 'אישור'),
        h('button', { class: 'btn ghost', onclick: () => { close(); resolve(false); } }, cancelLabel || 'ביטול'))
    ], () => resolve(false));
  });
}

function askText(title, value) {
  return new Promise(resolve => {
    const inp = h('input', { class: 'i', value: value || '' });
    sheet(close => [
      h('h3', null, title), inp,
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary', onclick: () => { close(); resolve(inp.value.trim() || null); } }, 'שמירה'),
        h('button', { class: 'btn ghost', onclick: () => { close(); resolve(null); } }, 'ביטול'))
    ], () => resolve(null));
    setTimeout(() => inp.focus(), 50);
  });
}

/** Bottom sheet. builder(close) returns the content. */
function sheet(builder, onDismiss) {
  const scrim = h('div', { class: 'scrim' });
  const close = () => scrim.remove();
  scrim.addEventListener('click', e => { if (e.target === scrim) { close(); if (onDismiss) onDismiss(); } });
  scrim.appendChild(h('div', { class: 'sheet' }, builder(close)));
  document.body.appendChild(scrim);
}

/* ================= onboarding · license lock · settings ================= */

function renderGate() {
  const g = S.gate;
  ['tabs', 'syncBtn', 'settingsBtn'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('syncLabel').textContent = '';
  const lic = g.license || {};
  const screen = g.needsTerms ? viewTerms(g)
    : g.needsOnboarding ? (g.termsOk && g.licensing && !lic.ok && lic.status !== 'none' ? viewLocked(g) : viewOnboarding(g))
    : viewLocked(g);
  document.getElementById('view').replaceChildren(...[].concat(screen).flat(9).filter(Boolean));
}

function genderSeg(value, onPick) {
  const seg = h('div', { class: 'seg' });
  const paint = v => seg.replaceChildren(...[['זכר', 'זכר'], ['נקבה', 'נקבה'], ['', 'ניטרלי']].map(([k, l]) =>
    h('button', { class: v === k ? 'on' : '', onclick: () => { onPick(k); paint(k); } }, l)));
  paint(value);
  return seg;
}

function termsCheck(st, g) {
  return h('label', { class: 'row small', style: 'margin-top:12px;align-items:flex-start' },
    h('input', { type: 'checkbox', checked: st.terms, style: 'margin-top:3px', onchange: e => { st.terms = e.target.checked; } }),
    h('span', null, 'קראתי ואני ' + G('מסכים', 'מסכימה', 'מסכים/ה') + ' ל',
      h('a', { href: g.termsUrl, target: '_blank' }, 'תנאי השימוש'), ' – כולל ההבנה שזו גרסת אלפא, ושהתנאים עשויים להשתנות בהמשך (גם לגבי רישיונות).'));
}

function viewOnboarding(g) {
  const d = g.draft || {};
  const st = S.onb = S.onb || { name: d.senderName || '', clinic: d.clinicLocation || '', url: d.existingUrl || '', restore: !!d.existingUrl, terms: false,
    courses: d.courses || [], cName: '', cYear: '' };
  if (S.onboardGender === undefined && d.userGender !== undefined) S.onboardGender = d.userGender;
  const field = (k, attrs) => h('input', Object.assign({ class: 'i', value: st[k], oninput: e => { st[k] = e.target.value; } }, attrs));
  const go = async allowShared => {
    if (!st.name.trim()) return toast(G('כתוב את השם שלך', 'כתבי את השם שלך', 'צריך לכתוב שם'), true);
    if (st.restore && !st.url.trim()) return toast('צריך להדביק את הקישור לגיליון ניהול המטופלים', true);
    if (!st.terms) return toast('צריך לאשר את תנאי השימוש', true);
    if (st.cName.trim()) addCourse();
    st.working = true; renderGate(); busy(true);
    let shared = 0;
    try {
      const snap = await call('requestAccess', { senderName: st.name, userGender: S.onboardGender || '', clinicLocation: st.clinic,
        existingUrl: st.restore ? st.url : '', allowShared: !!allowShared, courses: st.courses, acceptTerms: true });
      S.onb = null; setData(snap);
      if (snap.patients) toast('✓ המערכת מוכנה');
    } catch (e) {
      const m = String(e.message).match(/^SHARED:(\d+)/);
      if (m) shared = Number(m[1]); else toast(e.message, true);
    }
    finally { busy(false); if (S.onb) { st.working = false; renderGate(); } }
    if (shared && await ask(`הגיליון הזה משותף עם ${shared} אנשים נוספים – הם יראו את פרטי המטופלים שתזין/י. להשתמש בו בכל זאת?`, 'כן, הוא שלי', 'לא, ניצור גיליון חדש')) go(true);
    else if (shared) { st.restore = false; renderGate(); }
  };
  const addCourse = () => {
    const n = st.cName.trim(); if (!n) return;
    if (!st.courses.some(c => c.name === n && c.year === st.cYear.trim())) st.courses.push({ name: n, year: st.cYear.trim() });
    st.cName = ''; renderGate();
  };
  return [
    h('div', { class: 'card' },
      h('img', { class: 'brand-logo', src: (window.BRAND || {}).logo, alt: 'MoonCRM' }),
      h('h2', { style: 'margin-top:0;justify-content:center' }, G('ברוך הבא', 'ברוכה הבאה', 'ברוכים הבאים')),
      h('p', null, `המערכת תקים גיליון ויומן משלה בחשבון הגוגל שלך${g.email ? ` (${g.email})` : ''}. הנתונים נשמרים רק אצלך.`),
      g.licensing ? h('div', { class: 'alert info small' }, 'MoonCRM בגרסת אלפא, בהזמנה בלבד: הבקשה נשלחת לאישור, והמערכת נפתחת מיד אחרי שהיא מאושרת.') : null,
      h('label', { class: 'f' }, 'השם שלך (יופיע בסוף ההודעות למטופלים)'), field('name', { placeholder: 'שם' }),
      h('label', { class: 'f' }, 'איך לפנות אליך? (גם בהודעות שנשלחות בשמך)'),
      genderSeg(S.onboardGender || '', v => { S.onboardGender = v; renderGate(); }),
      h('label', { class: 'f' }, 'המרפאה (נכנס להודעות)'), field('clinic', { placeholder: 'למשל: במרפאת הסטודנטים, קומה 2' }),
      h('label', { class: 'f' }, 'הקורסים שלך השנה (אפשר גם אחר כך)'),
      st.courses.length ? h('div', { class: 'chips', style: 'flex-wrap:wrap;margin-bottom:6px' }, st.courses.map((c, i) =>
        h('button', { class: 'chip on', title: 'הסרה', onclick: () => { st.courses.splice(i, 1); renderGate(); } }, (c.year ? c.year + '׳ · ' : '') + c.name + ' ✕'))) : null,
      h('div', { class: 'row' },
        h('div', { class: 'grow' }, field('cName', { placeholder: 'שם הקורס, למשל: שיקום', onkeydown: e => { if (e.key === 'Enter') addCourse(); } })),
        h('div', { style: 'width:90px' }, field('cYear', { placeholder: 'שנה: ה' })),
        h('button', { class: 'btn sm', onclick: addCourse }, '+ הוספה')),

      h('label', { class: 'f', style: 'margin-top:12px' }, 'גיליון ניהול המטופלים'),
      h('div', { class: 'seg' },
        h('button', { class: st.restore ? '' : 'on', onclick: () => { st.restore = false; renderGate(); } }, 'ליצור גיליון חדש (מומלץ)'),
        h('button', { class: st.restore ? 'on' : '', onclick: () => { st.restore = true; renderGate(); } }, 'יש לי כבר גיליון מטופלים')),
      h('p', { class: 'muted small', style: 'margin:6px 0 0' }, st.restore
        ? 'MoonCRM תוסיף את הלשוניות שלה (מטופלים, טיפולים, הגדרות…) לגיליון שלך, בלי לגעת בלשוניות הקיימות. לא לחבר גיליון שמשותף עם אחרים – הם יראו את פרטי המטופלים. זה גם הגיליון שאליו מקשרים את טופס הקבלה.'
        : 'MoonCRM תיצור בדרייב שלך גיליון פרטי חדש בשם "MoonCRM" לניהול המטופלים – רק את/ה רואה אותו. אליו גם מקשרים אחר כך את טופס הקבלה. רשימת מטופלים קיימת אפשר לייבא אחרי ההקמה.'),
      st.restore ? field('url', { placeholder: 'קישור לגיליון ניהול המטופלים: https:\/\/docs.google.com/spreadsheets/d/…', dir: 'ltr' }) : null,
      termsCheck(st, g),
      h('div', { class: 'actions' },
        h('button', { class: 'btn primary block', disabled: st.working, onclick: () => go(false) },
          st.working ? 'רגע… (הקמת המערכת לוקחת כדקה, לא לסגור את הדף)'
            : g.licensing && !(g.license || {}).ok ? 'שליחת בקשת הצטרפות' : G('הקם את המערכת', 'הקימי את המערכת', 'הקמת המערכת'))),
      h('p', { class: 'muted small' }, 'גוגל תבקש אישור לגישה לגיליונות, ליומן, לקבצים שהמערכת עצמה יוצרת ולשליחת מייל בשמך. המערכת לא רואה קבצים אחרים בדרייב שלך.'),
      window.mooncrmSignOut ? h('button', { class: 'btn ghost sm', onclick: () => window.mooncrmSignOut() }, '↩ החלפת חשבון') : null)
  ];
}

/** Terms changed (or were never accepted on this account): accept before continuing. */
function viewTerms(g) {
  const st = { terms: false };
  return h('div', { class: 'card' },
    h('img', { class: 'brand-logo', src: (window.BRAND || {}).logo, alt: 'MoonCRM' }),
    h('h2', { style: 'margin-top:0' }, '📄 תנאי השימוש'),
    h('p', null, 'כדי להמשיך להשתמש ב-MoonCRM צריך לאשר את תנאי השימוש. הנתונים שלך לא השתנו.'),
    h('a', { class: 'btn', href: g.termsUrl, target: '_blank' }, 'קריאת התנאים ↗'),
    termsCheck(st, g),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary block', onclick: async () => {
      if (!st.terms) return toast('צריך לסמן את האישור', true);
      busy(true); try { setData(await call('acceptTerms')); } catch (e) { toast(e.message, true); } finally { busy(false); }
    } }, 'אישור והמשך')));
}

function viewLocked(g) {
  const lic = g.license || {};
  const pending = lic.status === 'pending';
  const titles = { pending: '⏳ הבקשה נשלחה', expired: '🔒 תוקף הרישיון הסתיים', blocked: '🔒 הגישה נחסמה', cancelled: '🔒 הגישה בוטלה',
    unreachable: '⚠️ לא ניתן לבדוק את ההרשאה כרגע' };
  const recheck = async () => { busy(true); try { const r = await call('recheckLicense'); setData(r); if (r.patients) toast('✓ אושר!'); else if (r.license && r.license.status === 'pending') toast('עדיין ממתין לאישור'); } catch (e) { toast(e.message, true); } finally { busy(false); } };
  return h('div', { class: 'card' },
    h('img', { class: 'brand-logo', src: (window.BRAND || {}).logo, alt: 'MoonCRM' }),
    h('h2', { style: 'margin-top:0' }, titles[lic.status] || '🔒 אין הרשאת שימוש פעילה'),
    pending ? h('p', null, 'בקשת ההצטרפות ל-MoonCRM התקבלה וממתינה לאישור. אחרי האישור – ללחוץ "בדיקה שוב" (או לחזור לכאן מאוחר יותר), והמערכת תוקם אוטומטית.')
      : lic.message ? h('p', null, lic.message) : null,
    lic.expires && !pending ? h('p', { class: 'muted' }, 'תוקף עד: ' + fDateY(D(lic.expires))) : null,
    g.email ? h('p', { class: 'muted small' }, 'חשבון: ' + g.email) : null,
    g.contact ? h('p', null, g.contact) : null,
    g.sheetUrl ? [h('p', { class: 'muted small' }, 'האוטומציות (תזכורות, ייבוא, סנכרון) מושהות. הנתונים שלך לא נמחקו – הם בגיליון ובלוח השנה בחשבון שלך.'),
      h('a', { class: 'btn', href: g.sheetUrl, target: '_blank' }, '📄 הנתונים שלי בגיליון ↗')] : null,
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: recheck }, '⟳ בדיקה שוב'), window.mooncrmSignOut ? h('button', { class: 'btn ghost sm', onclick: () => window.mooncrmSignOut() }, '↩ החלפת חשבון') : null));
}

function licenseBanner() {
  const a = S.data.account, lic = a.license || {};
  if (!a.licensing || !lic.ok || lic.daysLeft === null || lic.daysLeft > a.warnDays) return null;
  return h('div', { class: 'alert small' }, `⏳ הרישיון יפוג בעוד ${lic.daysLeft} ימים (${fDateY(D(lic.expires))}).`, a.contact ? ' ' + a.contact : '');
}

/** Vendor only: everyone who asked for access – approve, block, remove, pre-approve. */
async function adminUsers() {
  let first;
  busy(true);
  try { first = await call('adminUsers'); } catch (e) { return toast(e.message, true); } finally { busy(false); }
  const ST = { 'פעיל': 'ok', 'ממתין לאישור': 'warn', 'חסום': 'danger', 'בוטל': 'gray' };
  const addIn = h('input', { class: 'i', type: 'email', placeholder: 'מייל של חשבון גוגל', dir: 'ltr' });
  const box = h('div');
  const set = async (email, code) => {
    busy(true);
    try { paint(await call('adminSetUser', email, code)); toast('עודכן'); } catch (e) { toast(e.message, true); } finally { busy(false); }
  };
  const paint = res => {
    const users = res.users || [], pend = users.filter(u => u.status === 'ממתין לאישור').length;
    box.replaceChildren(
      h('div', { class: 'muted small' }, `${users.length} חשבונות` + (pend ? ` · ${pend} ממתינים לאישור` : '')),
      h('div', { class: 'card', style: 'margin-top:6px' }, users.length ? users.map(u => h('div', { class: 't-item' },
        h('div', { class: 'grow', style: 'min-width:0' },
          h('div', { class: 'row' }, h('b', { class: 'grow ellipsis' }, u.name || u.email),
            h('span', { class: 'badge ' + (ST[u.status] || 'gray') }, u.owner ? 'בעלים' : u.status)),
          h('div', { class: 'muted small ellipsis', dir: 'ltr', style: 'text-align:right' }, u.email),
          h('div', { class: 'muted small' }, [u.seen && 'נראה לאחרונה ' + u.seen, u.expires && 'תוקף עד ' + u.expires,
            u.terms ? 'אישר/ה תנאים' : 'עוד לא אישר/ה תנאים'].filter(Boolean).join(' · ')),
          u.owner ? null : h('div', { class: 'actions', style: 'margin-top:6px' },
            u.status !== 'פעיל' ? h('button', { class: 'btn sm primary', onclick: () => set(u.email, 'active') }, '✓ אישור') : null,
            u.status !== 'חסום' ? h('button', { class: 'btn sm danger', onclick: () => set(u.email, 'blocked') }, 'חסימה') : null,
            u.status !== 'בוטל' ? h('button', { class: 'btn sm', onclick: () => set(u.email, 'cancelled') }, 'הסרה') : null))))
        : h('div', { class: 'empty' }, 'עוד אין משתמשים')));
  };
  paint(first);
  sheet(close => [
    h('h3', null, '👥 משתמשים'),
    h('p', { class: 'muted small' }, 'חסימה או הסרה עוצרות את המערכת אצל המשתמש/ת תוך שעה לכל היותר. הנתונים שלהם לא נמחקים – הם בחשבון הגוגל שלהם.'),
    box,
    h('label', { class: 'f' }, 'אישור מראש (לפני שהם נכנסים)'),
    h('div', { class: 'row' }, h('div', { class: 'grow' }, addIn),
      h('button', { class: 'btn sm primary', onclick: () => addIn.value.trim() ? set(addIn.value.trim(), 'active') : toast('צריך מייל', true) }, '+ אישור')),
    h('div', { class: 'alert info small', style: 'margin-top:10px' },
      'מגבלת גוגל: עד 100 חשבונות יכולים לאשר את המערכת כל עוד היא לא עברה אימות של גוגל. הספירה היא לכל חיי הפרויקט – חשבון שהוסר נשאר בספירה. הספירה המדויקת: ',
      h('a', { href: 'https:\/\/console.cloud.google.com/auth/audience?project=mooncrm-app', target: '_blank' }, 'Google Cloud ← Audience ↗')),
    h('div', { class: 'actions' },
      first.sheetUrl ? h('a', { class: 'btn', href: first.sheetUrl, target: '_blank' }, '📄 גיליון המשתמשים ↗') : null,
      h('button', { class: 'btn ghost', onclick: close }, 'סגירה'))
  ]);
}

function settingsSheet() {
  const d = S.data, s = d.settings, a = d.account, lic = a.license || {};
  const st = { senderName: s.senderName, userGender: s.userGender, clinicLocation: s.clinicLocation, defaultDuration: s.defaultDuration,
    contactMethods: (s.contactMethods || []).join(', ') };
  const inp = (k, attrs) => h('input', Object.assign({ class: 'i', value: st[k] || '', oninput: e => { st[k] = e.target.value; } }, attrs));
  const LS = { active: ['פעיל', 'ok'], pending: ['ממתין לאישור', 'warn'], expired: ['פג תוקף', 'danger'], blocked: ['חסום', 'danger'], cancelled: ['בוטל', 'danger'], off: ['ללא רישוי', 'gray'] };
  sheet(close => [
    h('h3', null, '⚙️ הגדרות'),
    h('label', { class: 'f' }, 'השם שלך (סוף ההודעות ושם השולח במייל)'), inp('senderName'),
    h('label', { class: 'f' }, 'איך לפנות אליך (גם בהודעות שנשלחות בשמך)'), genderSeg(st.userGender || '', v => { st.userGender = v; }),
    h('label', { class: 'f' }, 'המרפאה – {מיקום}'), inp('clinicLocation'),
    h('label', { class: 'f' }, 'משך תור ברירת מחדל (דקות)'), inp('defaultDuration', { type: 'number', min: 10, step: 5 }),
    h('label', { class: 'f' }, 'אפשרויות "דרך יצירת קשר" (מופרדות בפסיקים)'), inp('contactMethods'),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary', onclick: async () => { await mutate('saveSettings', st); close(); toast('נשמר'); } }, 'שמירה')),

    a.licensing ? [
      h('h3', { style: 'margin-top:16px' }, '🔑 הרשאת שימוש'),
      h('div', { class: 'row wrap small' }, h('span', { class: 'badge ' + ((LS[lic.status] || [])[1] || 'gray') }, (LS[lic.status] || [lic.status])[0]),
        lic.plan ? h('span', null, lic.plan) : null, lic.expires ? h('span', null, 'עד ' + fDateY(D(lic.expires))) : null,
        lic.offline ? h('span', { class: 'badge warn' }, 'לא מקוון') : null),
      h('div', { class: 'small', style: 'margin-top:4px' }, h('a', { href: a.termsUrl, target: '_blank' }, 'תנאי השימוש ↗')),
      lic.owner ? h('div', { class: 'actions' }, h('button', { class: 'btn', onclick: () => { close(); adminUsers(); } }, '👥 ניהול משתמשים')) : null
    ] : null,

    h('h3', { style: 'margin-top:16px' }, '📲 וואטסאפ'),
    h('label', { class: 'row small' },
      h('input', { type: 'checkbox', checked: s.dailyDigest, onchange: e => mutate('saveSettings', { dailyDigest: e.target.checked ? 'כן' : 'לא' }) }),
      h('span', { class: 'grow' }, 'התראה בבוקר כשיש הודעות לשלוח (דרך יומן גוגל) בשעה'),
      h('select', { class: 'i', style: 'width:auto', onchange: e => mutate('saveSettings', { digestHour: e.target.value }) },
        [7, 8, 9, 10, 11, 12].map(x => opt(String(x), x + ':00', x === s.digestHour)))),
    h('h3', { style: 'margin-top:16px' }, '🤖 ניתוח מסמכים (Gemini)'),
    h('div', { class: 'row small' }, h('span', { class: 'grow' }, s.aiPersonal ? '✓ AI אישי פעיל' : s.aiKeyShared ? 'עובד עם המפתח המשותף של המערכת' : 'לא מחובר'),
      s.hasAiKey && !s.aiKeyShared
        ? h('button', { class: 'btn sm', onclick: async () => { busy(true); try { await call('setGeminiKey', ''); await load('bootstrap'); close(); toast('נותק'); } finally { busy(false); } } }, 'ניתוק')
        : h('button', { class: 'btn sm', onclick: () => { close(); personalAiDialog(); } }, '🔑 הפעלת AI אישי')),
    s.checklistHidden ? h('button', { class: 'btn ghost sm', onclick: async () => { await mutate('saveSettings', { checklistHidden: '' }); close(); go('today'); } }, '🚀 הצגת "צעדים ראשונים"') : null,

    h('h3', { style: 'margin-top:16px' }, 'מערכת'),
    h('div', { class: 'muted small' }, `${a.email || ''} · גרסה ${a.version}`),
    h('div', { class: 'actions' },
      h('a', { class: 'btn', href: s.sheetUrl, target: '_blank' }, '📄 הגיליון ↗'),
      h('button', { class: 'btn', onclick: () => { close(); moveSheetDialog(); } }, '🔄 החלפת גיליון'),
      h('button', { class: 'btn', onclick: async () => {
        if (!await ask('לתקן את המערכת? הלשוניות, היומן והאוטומציות ייבדקו וייווצרו מחדש אם חסר משהו. נתונים לא נמחקים.', 'תיקון')) return;
        await mutate('repairWorkspace'); close(); toast('✓ המערכת תוקנה');
      } }, '🔧 תיקון המערכת'),
      h('button', { class: 'btn ghost', onclick: close }, 'סגירה')),
    window.mooncrmSignOut ? h('div', { class: 'actions', style: 'margin-top:4px' },
      h('button', { class: 'btn danger', onclick: async () => {
        if (await ask('להתנתק? אפשר להתחבר מיד עם אותו חשבון או עם חשבון אחר. הנתונים נשארים בחשבון הגוגל.', 'התנתקות', 'ביטול')) window.mooncrmSignOut();
      } }, '↩ התנתקות / החלפת חשבון')) : null
  ]);
}
document.getElementById('settingsBtn').addEventListener('click', () => S.data && settingsSheet());

/* ================= boot ================= */
(function boot() {
  const icon = document.getElementById('brandIcon');
  if (icon && window.BRAND) icon.src = BRAND.icon;
  const start = hash => {
    const m = String(hash || '').match(/^\/?p\/(\w+)/);
    const t = String(hash || '').match(/^\/?(today|table|schedule|messages|reqs|templates)$/);
    // google.script.run never answers when the browser holds several Google accounts: say so instead of spinning forever.
    const slow = setTimeout(() => {
      if (S.data || S.gate || window.__moonAuthWait) return; // __moonAuthWait: the site shell is signing in
      document.getElementById('view').replaceChildren(h('div', { class: 'card' },
        h('b', {}, 'הטעינה לוקחת יותר מדי זמן'),
        h('p', { class: 'muted' }, 'זה קורה בדרך כלל כשבדפדפן מחוברים כמה חשבונות גוגל. ' + G('פתח', 'פתחי', 'כדאי לפתוח') +
          ' את הכתובת בחלון גלישה בסתר (או בדפדפן אחר), עם חשבון הגוגל שלך בלבד.'),
        h('button', { class: 'btn', onclick: () => location.reload() }, '⟳ ניסיון נוסף')));
    }, 20000);
    load('bootstrap').then(() => {
      clearTimeout(slow);
      if (m && IDX.p[m[1]]) openPatient(m[1]);
      else if (t) go(t[1]);
    }).catch(() => document.getElementById('view').replaceChildren(h('div', { class: 'card empty' }, 'הטעינה נכשלה. ' + G('נסה', 'נסי', 'כדאי') + ' לרענן את הדף.')));
  };
  try { google.script.url.getLocation(loc => start(loc.hash)); } catch (e) { start(location.hash.slice(1)); }
})();
</script>

</body>
</html>
